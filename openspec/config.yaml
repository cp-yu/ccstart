schema: spec-driven

# OpenSpec document prose language (optional)
# Applies only to natural-language body text in artifacts.
# Keep template headings, IDs, schema keys, commands, and code tokens unchanged.
# Example:
#   docLanguage: zh-CN
docLanguage: 中文

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Verify Phase 2 optimization policy (optional)
# Set enabled: false to keep verify in Phase 1 conformance-only mode.
# Example:
#   optimization:
#     enabled: true
#     optRetries: 2
optimization:
  enabled: true
  optRetries: 2

# Apply-stage implementation policy (optional)
# Example:
#   apply:
#     defaultIsolation: ask  # ask / branch / worktree / none
apply:
  defaultIsolation: branch # ask / branch / worktree / none

# Git archive and merge policy (optional)
# Example:
#   git:
#     merge:
#       strategy: no-ff
#       messageFrom: artifacts
#     branch:
#       deleteAfterArchive: false
git:
  merge:
    strategy: no-ff
  branch:
    deleteAfterArchive: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
