schema_version: 1
ADDED:
  capabilities:
    - id: cap.codex.dispatch
      type: capability
      intent: 接受 ccstart codex <channel> [args...] 调用，从 cc-switch 数据库查询 codex provider 并通过运行时注入（env + -c）非破坏性启动 codex 进程。
      status: active
    - id: cap.codex.completion
      type: capability
      intent: 为 codex 子命令的 channel 参数提供 shell 动态自动补全，候选值从数据库 app_type='codex' 实时查询。
      status: active
  relations:
    - from: cap.codex.dispatch
      type: contains
      to: dom.cli
    - from: cap.codex.dispatch
      type: depends_on
      to: dom.provider
    - from: cap.codex.completion
      type: contains
      to: dom.cli
    - from: cap.codex.completion
      type: depends_on
      to: dom.provider
MODIFIED:
  capabilities:
    - id: cap.provider.query
      intent: 打开 cc-switch SQLite 数据库并按 app_type 参数查询 provider 配置（支持 claude 和 codex）。
